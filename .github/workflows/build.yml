# =============================================================
# HarryWrt — Multi-version, Multi-platform, Multi-profile Build (matrix)
#
# Matrix: OpenWrt 25.12 × 5 platforms × clean + plus (10 builds)
#
# The OpenWrt version is defined ONCE here (OWRT) and used by the matrix and
# the release notes. Bump it for every service release — they carry
# security fixes. OpenWrt 24.10 reached end of life on 2026-09-30 and is no
# longer built (its last HarryWrt release is v4.0).
#
# Release assets: every build uploads its images plus ONE buildinfo archive
# (package manifest, feeds/config/version buildinfo) as a workflow artifact.
# A single "release" job then publishes all of them with one combined
# SHA256SUMS, so the release page lists firmware, not dozens of small files.
# =============================================================
name: Build HarryWrt

env:
  OWRT: "25.12.6"
  # Only needed for the optional tmate SSH-debug action; all other actions
  # below are Node 24 majors.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. v3.2)"
        required: true
        default: "v3.2"
      ssh_debug:
        description: "Enable SSH debug session (tmate)"
        required: false
        default: "false"
      build_filter:
        description: "Build filter (all / clean / plus / boards / x86_64 / aarch64 / rockchip / rpi4 / rpi5)"
        required: false
        default: "all"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Matrix generation ──────────────────────────────────────
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        env:
          FILTER: ${{ github.event.inputs.build_filter || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os

          version = os.environ["OWRT"]
          # target  = name used in file names and build_filter
          # arch    = OpenWrt target/subtarget (bin/targets/<arch>)
          # config  = configs/targets/<config>.config
          targets = [
              {"target": "x86_64",   "arch": "x86/64",         "config": "x86_64"},
              {"target": "aarch64",  "arch": "armsr/armv8",    "config": "aarch64"},
              {"target": "rockchip", "arch": "rockchip/armv8", "config": "rockchip"},
              {"target": "rpi4",     "arch": "bcm27xx/bcm2711", "config": "rpi4"},
              {"target": "rpi5",     "arch": "bcm27xx/bcm2712", "config": "rpi5"},
          ]
          target_names = [t["target"] for t in targets]
          jobs = [
              dict(t, owrt_tag="v" + version, owrt_base=version, profile=p, runner="ubuntu-24.04")
              for p in ("clean", "plus") for t in targets
          ]

          f = os.environ.get("FILTER", "all").strip()
          if f in target_names:
              jobs = [j for j in jobs if j["target"] == f]
          elif f == "boards":
              jobs = [j for j in jobs if j["target"] in ("rockchip", "rpi4", "rpi5")]
          elif f in ("clean", "plus"):
              jobs = [j for j in jobs if j["profile"] == f]
          elif f != "all":
              raise SystemExit(f"Unknown build_filter '{f}' (use all / clean / plus / boards / "
                               + " / ".join(target_names) + ")")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": jobs}, separators=(",", ":")) + "\n")
          print(f"Building {len(jobs)} job(s):")
          for j in jobs:
              print(f"  {j['owrt_base']} {j['profile']} {j['target']}")
          PY

  # ── Build each combination ─────────────────────────────────
  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    env:
      OWRT_TAG:  ${{ matrix.owrt_tag }}
      OWRT_BASE: ${{ matrix.owrt_base }}
      OWRT_REPO: "https://github.com/openwrt/openwrt.git"
      TARGET:    ${{ matrix.target }}
      ARCH_PATH: ${{ matrix.arch }}
      CONFIG:    ${{ matrix.config }}
      PROFILE:   ${{ matrix.profile }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            rel="${{ github.event.inputs.release_version }}"
          else
            tag="${GITHUB_REF##*/}"
            # Accept any tag starting with 'v' followed by a digit; use the
            # tag verbatim. This supports both plain v3.1 and richer tags
            # like v3.1-rc1 without silently downgrading to a hardcoded
            # placeholder version. Anything else aborts the build so we
            # never publish firmware with the wrong banner.
            if [[ "$tag" =~ ^v[0-9] ]]; then
              rel="$tag"
            else
              echo "ERROR: pushed tag '$tag' does not match expected vN[.N…] format." >&2
              echo "       Re-tag with e.g. 'v3.1' and push again." >&2
              exit 1
            fi
          fi
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "Release: $rel  |  OpenWrt: ${OWRT_BASE}  |  Target: ${TARGET}"

      - name: Free disk space and enable swap
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache || true
          sudo apt-get clean || true
          df -h

          SWAP_PATH="/mnt/gh-swapfile"
          sudo swapoff "$SWAP_PATH" 2>/dev/null || true
          sudo rm -f "$SWAP_PATH" || true
          if ! sudo fallocate -l 8G "$SWAP_PATH" 2>/dev/null; then
            sudo dd if=/dev/zero of="$SWAP_PATH" bs=1M count=8192 status=progress
          fi
          sudo chmod 600 "$SWAP_PATH"
          sudo mkswap "$SWAP_PATH"
          sudo swapon "$SWAP_PATH"
          free -h || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget curl ca-certificates time \
            python3 python3-setuptools python3-pyelftools \
            gperf swig subversion mercurial \
            ccache jq

      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ env.OWRT_TAG }}-${{ env.TARGET }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.OWRT_TAG }}-${{ env.TARGET }}-
            ccache-${{ env.OWRT_TAG }}-

      - name: Clone OpenWrt source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${OWRT_TAG}" "${OWRT_REPO}" openwrt
          : > openwrt/build.log

      - name: Add Passwall packages feed
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tee -a build.log
          ./scripts/feeds install -a -f 2>&1 | tee -a build.log

      - name: Apply config and run DIY
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt

          # Platform (target + hardware) + edition (packages)
          cat "${GITHUB_WORKSPACE}/configs/targets/${CONFIG}.config" \
              "${GITHUB_WORKSPACE}/configs/profiles/${PROFILE}.config" > .config
          echo "CONFIG_CCACHE=y" >> .config

          # Run DIY script
          chmod +x "${GITHUB_WORKSPACE}/scripts/diy.sh"
          bash "${GITHUB_WORKSPACE}/scripts/diy.sh" "${OWRT_BASE}" "${TARGET}" "${PROFILE}" "${{ steps.meta.outputs.release }}" 2>&1 | tee -a build.log

          make defconfig 2>&1 | tee -a build.log

          # Validate critical packages
          echo "Checking important packages in final .config..." | tee -a build.log
          MUST_Y=(
            "CONFIG_PACKAGE_dnsmasq-full"
            "CONFIG_PACKAGE_kmod-nft-tproxy"
            "CONFIG_PACKAGE_kmod-nft-socket"
            "CONFIG_PACKAGE_kmod-tun"
            "CONFIG_PACKAGE_coreutils"
            "CONFIG_PACKAGE_coreutils-base64"
            "CONFIG_PACKAGE_coreutils-nohup"
            "CONFIG_PACKAGE_coreutils-timeout"
            "CONFIG_PACKAGE_libuci-lua"
            "CONFIG_PACKAGE_lua"
            "CONFIG_PACKAGE_luci-lib-jsonc"
            "CONFIG_PACKAGE_resolveip"
            "CONFIG_PACKAGE_irqbalance"
          )

          # Plus-only required packages
          MUST_Y_PLUS=(
            "CONFIG_PACKAGE_wireguard-tools"
            "CONFIG_PACKAGE_ddns-scripts"
            "CONFIG_PACKAGE_luci-app-acme"
            "CONFIG_PACKAGE_tcping"
            "CONFIG_PACKAGE_geoview"
            "CONFIG_PACKAGE_v2ray-geoip"
            "CONFIG_PACKAGE_v2ray-geosite"
            "CONFIG_PACKAGE_xray-core"
            "CONFIG_PACKAGE_sing-box"
            "CONFIG_PACKAGE_lyaml"
            "CONFIG_PACKAGE_chinadns-ng"
            "CONFIG_PACKAGE_kmod-tcp-bbr"
          )

          missing=0
          for k in "${MUST_Y[@]}"; do
            if grep -qE "^${k}=y$" .config; then
              echo "OK: ${k}=y" | tee -a build.log
            else
              echo "MISSING: ${k}=y" | tee -a build.log
              missing=1
            fi
          done

          if [[ "${PROFILE}" == "plus" ]]; then
            for k in "${MUST_Y_PLUS[@]}"; do
              if grep -qE "^${k}=y$" .config; then
                echo "OK: ${k}=y" | tee -a build.log
              else
                echo "MISSING (plus): ${k}=y" | tee -a build.log
                missing=1
              fi
            done
          fi

          # Plus promises an offline-ready Passwall2 install. Passwall2 keeps
          # adding runtime dependencies (26.x added coreutils-timeout), and a
          # single missing one makes the offline install fail. Check the
          # CURRENT upstream LUCI_DEPENDS instead of a list frozen in this file.
          if [[ "${PROFILE}" == "plus" ]]; then
            PW2_MK_URL="https://raw.githubusercontent.com/Openwrt-Passwall/openwrt-passwall2/main/luci-app-passwall2/Makefile"
            if curl -fsSL --retry 3 --max-time 30 "$PW2_MK_URL" -o /tmp/pw2.mk; then
              pw2_deps=$(awk '/^LUCI_DEPENDS:=/{f=1} f{print; if ($0 !~ /\\$/) exit}' /tmp/pw2.mk \
                         | grep -o '+[A-Za-z0-9._-]*' | tr -d '+' | sort -u)
              if [[ -z "$pw2_deps" ]]; then
                echo "::warning::Could not parse Passwall2 LUCI_DEPENDS; skipping upstream dependency check"
              fi
              for dep in $pw2_deps; do
                if grep -qE "^CONFIG_PACKAGE_${dep}=y$" .config; then
                  echo "OK (passwall2 dep): ${dep}" | tee -a build.log
                else
                  echo "MISSING (passwall2 dep): ${dep} — add CONFIG_PACKAGE_${dep}=y to the plus configs" | tee -a build.log
                  missing=1
                fi
              done
            else
              echo "::warning::Could not download Passwall2 Makefile; skipping upstream dependency check"
            fi
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "ERROR: Required packages missing in .config" | tee -a build.log
            exit 1
          fi

          # Board platforms list several devices. `make defconfig` silently
          # drops device profiles this OpenWrt release doesn't know, so check
          # which requested boards survived. Unknown boards are skipped with
          # a warning (support differs between releases); every accepted
          # board is verified to have produced an image after the build.
          requested=$(sed -n 's/^CONFIG_TARGET_DEVICE_[A-Za-z0-9]*_[A-Za-z0-9]*_DEVICE_\(.*\)=y$/\1/p' \
                      "${GITHUB_WORKSPACE}/configs/targets/${CONFIG}.config")
          accepted=""
          for dev in $requested; do
            if grep -qE "^CONFIG_TARGET_DEVICE_[A-Za-z0-9]+_[A-Za-z0-9]+_DEVICE_${dev}=y$" .config; then
              accepted="${accepted:+$accepted }${dev}"
              echo "OK (board): ${dev}" | tee -a build.log
            else
              echo "::warning::Board '${dev}' is not available in OpenWrt ${OWRT_BASE}; skipping it"
              echo "SKIPPED (board not in ${OWRT_BASE}): ${dev}" | tee -a build.log
            fi
          done
          if [[ -n "$requested" && -z "$accepted" ]]; then
            echo "ERROR: none of the requested boards exist in OpenWrt ${OWRT_BASE}" | tee -a build.log
            exit 1
          fi
          echo "HW_DEVICES=${accepted}" >> "$GITHUB_ENV"

      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          make download -j"$(nproc)" 2>&1 | tee -a build.log || \
            make download -j1 2>&1 | tee -a build.log

      - name: SSH debug session (on demand)
        if: github.event.inputs.ssh_debug == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          timeout-minutes: 30

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          BUILD_START=$(date +%s)
          echo "Build started at: $(date -u)" | tee -a build.log
          make -j"$(nproc)" 2>&1 | tee -a build.log || {
            echo "Parallel build failed, retrying single thread..." | tee -a build.log
            make -j1 V=s 2>&1 | tee -a build.log
          }
          BUILD_END=$(date +%s)
          BUILD_MIN=$(( (BUILD_END - BUILD_START) / 60 ))
          BUILD_SEC=$(( (BUILD_END - BUILD_START) % 60 ))
          echo "Build time: ${BUILD_MIN}m ${BUILD_SEC}s" | tee -a build.log
          echo "⏱ Build time: ${BUILD_MIN}m ${BUILD_SEC}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Organize and rename output files
        id: organize
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt/bin/targets/${ARCH_PATH}

          REL="${{ steps.meta.outputs.release }}"
          PREFIX="HarryWrt-${OWRT_BASE}-${PROFILE}-${REL}-${TARGET}"

          shopt -s nullglob
          # OpenWrt names images openwrt-<ver>-<target>-<subtarget>-<rest>.
          # Everything up to and including "<target>-<subtarget>-" is
          # replaced by the HarryWrt prefix.
          SRC_TAG="${ARCH_PATH//\//-}-"

          if [[ "${TARGET}" == "x86_64" ]]; then
            # x86: keep the established BIOS/UEFI names
            for pattern in \
              "*squashfs-combined.img.gz" \
              "*squashfs-combined-efi.img.gz" \
              "*ext4-combined.img.gz" \
              "*ext4-combined-efi.img.gz"
            do
              files=( $pattern )
              if [[ ${#files[@]} -eq 0 ]]; then
                echo "ERROR: No file matching '${pattern}'" >&2
                ls -lah . >&2
                exit 1
              fi
            done
            cp -f "$(ls -1 *squashfs-combined.img.gz     | head -n1)" "${PREFIX}-squashfs-bios.img.gz"
            cp -f "$(ls -1 *squashfs-combined-efi.img.gz | head -n1)" "${PREFIX}-squashfs-uefi.img.gz"
            cp -f "$(ls -1 *ext4-combined.img.gz         | head -n1)" "${PREFIX}-ext4-bios.img.gz"
            cp -f "$(ls -1 *ext4-combined-efi.img.gz     | head -n1)" "${PREFIX}-ext4-uefi.img.gz"
          else
            # aarch64 VM:  <...>-generic-{squashfs,ext4}-combined-efi.img.gz
            # boards:      <...>-<board>-{squashfs,ext4}-{sysupgrade,factory}.img.gz
            # Partition-only pieces (*-rootfs.img.gz, kernels) are not
            # installable on their own and are skipped.
            for f in openwrt-*"${SRC_TAG}"*.img.gz; do
              rest="${f#*"${SRC_TAG}"}"
              case "$rest" in
                *-rootfs.img.gz|*kernel*|*initramfs*) continue ;;
              esac
              rest="${rest#generic-}"
              cp -f "$f" "${PREFIX}-${rest}"
            done
          fi

          # Every board accepted at configure time must have an image.
          for dev in ${HW_DEVICES:-}; do
            imgs=( "${PREFIX}-${dev}-squashfs-"*.img.gz "${PREFIX}-${dev}-ext4-"*.img.gz )
            if [[ ${#imgs[@]} -eq 0 ]]; then
              echo "ERROR: no image produced for board '${dev}'" >&2
              ls -lah . >&2
              exit 1
            fi
            echo "Board ${dev}: ${#imgs[@]} image(s)"
          done

          imgs=( "${PREFIX}-"*.img.gz )
          if [[ ${#imgs[@]} -eq 0 ]]; then
            echo "ERROR: no firmware images found" >&2
            ls -lah . >&2
            exit 1
          fi

          # Build transparency: exact package versions (manifest) and the
          # exact feed commits / config used (buildinfo), bundled into ONE
          # archive per build. v4.0 uploaded each as a separate release
          # asset — 5 small files per build that looked like broken images.
          BI_DIR="$(mktemp -d)/${PREFIX}-buildinfo"
          mkdir -p "$BI_DIR"
          for f in openwrt-*"${SRC_TAG}"*.manifest; do
            rest="${f#*"${SRC_TAG}"}"
            if [[ "$rest" == "generic.manifest" ]]; then
              cp -f "$f" "${BI_DIR}/${PREFIX}.manifest"
            else
              cp -f "$f" "${BI_DIR}/${PREFIX}-${rest}"
            fi
          done
          for f in feeds.buildinfo version.buildinfo config.buildinfo; do
            [ -f "$f" ] && cp -f "$f" "${BI_DIR}/${f}"
          done
          if [[ -z "$(ls -A "$BI_DIR")" ]]; then
            echo "ERROR: no manifest or buildinfo files found" >&2
            exit 1
          fi
          # Reproducible archive: sorted names, fixed owner and mtime.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -C "$(dirname "$BI_DIR")" -cf - "$(basename "$BI_DIR")" | gzip -n -9 > "${PREFIX}-buildinfo.tar.gz"

          # Per-build checksums; the release job merges them into one SHA256SUMS.
          sha256sum "${PREFIX}"-* > "SHA256SUMS-${OWRT_BASE}-${PROFILE}-${TARGET}"
          echo "Output files:"
          ls -lah "${PREFIX}"-* "SHA256SUMS-${OWRT_BASE}-${PROFILE}-${TARGET}"
          tar -tzf "${PREFIX}-buildinfo.tar.gz"
          {
            echo "### ${OWRT_BASE} ${PROFILE} ${TARGET}"
            [ -n "${HW_DEVICES:-}" ] && echo "Boards: ${HW_DEVICES}"
            echo '```'
            ls -1 "${PREFIX}"-*.img.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "output_dir=openwrt/bin/targets/${ARCH_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Log-${{ env.OWRT_BASE }}-${{ env.PROFILE }}-${{ env.TARGET }}-${{ steps.meta.outputs.release }}
          path: openwrt/build.log

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: HarryWrt-${{ env.OWRT_BASE }}-${{ env.PROFILE }}-${{ steps.meta.outputs.release }}-${{ env.TARGET }}
          path: |
            ${{ steps.organize.outputs.output_dir }}/HarryWrt-*
            ${{ steps.organize.outputs.output_dir }}/SHA256SUMS-*

  # ── Publish one release for all builds (tag builds only) ──
  release:
    needs: build
    # Also runs when some builds failed: the successful ones are published
    # and the job summary lists what is missing.
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          pattern: HarryWrt-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${GITHUB_REF##*/}"
          REL="${TAG}"
          cd dist

          shopt -s nullglob
          parts=( SHA256SUMS-* )
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo "ERROR: no build outputs to publish" >&2
            exit 1
          fi

          # Verify every file against its per-build checksums, then merge
          # them into a single SHA256SUMS for the release.
          for p in "${parts[@]}"; do sha256sum -c --quiet "$p"; done
          cat "${parts[@]}" | sort -k2 > SHA256SUMS
          rm -f "${parts[@]}"

          assets=( HarryWrt-*.img.gz HarryWrt-*-buildinfo.tar.gz SHA256SUMS )
          echo "Publishing ${#assets[@]} assets (${#parts[@]} builds)"

          {
            echo "### Release ${TAG}"
            echo "Builds published: ${#parts[@]} · assets: ${#assets[@]}"
            if [[ "${BUILD_RESULT}" != "success" ]]; then
              echo ""
              echo "⚠️ Some builds failed — their files are missing from this release. Re-run the failed jobs, then re-run this job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # The release may already exist (created in the GitHub UI together
          # with the tag); its notes are then left untouched.
          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            sed -e "s/{{REL}}/${REL}/g" \
                -e "s/{{OWRT}}/${OWRT}/g" \
                "${GITHUB_WORKSPACE}/.github/RELEASE_TEMPLATE.md" > release_notes.md
            gh release create "${TAG}" --repo "${REPO}" \
              --title "HarryWrt ${REL}" --notes-file release_notes.md
          fi

          gh release upload "${TAG}" "${assets[@]}" --repo "${REPO}" --clobber

          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "::warning::Some builds failed; the release is incomplete"
          fi
